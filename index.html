        <!DOCTYPE html>
        <html lang="es">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Dashboard Informe - Superbot</title>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
            <style>
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }

                :root {
                    --bg-primary: #f5f7fa;
                    --bg-secondary: white;
                    --bg-tertiary: #f8f9fa;
                    --text-primary: #2c3e50;
                    --text-secondary: #7f8c8d;
                    --border-color: #e0e0e0;
                    --shadow-light: rgba(0,0,0,0.08);
                }

                body.dark-mode {
                    --bg-primary: #1a1a1a;
                    --bg-secondary: #2d2d2d;
                    --bg-tertiary: #333333;
                    --text-primary: #e0e0e0;
                    --text-secondary: #a0a0a0;
                    --border-color: #444444;
                    --shadow-light: rgba(0,0,0,0.3);
                }

                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
                    background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-tertiary) 100%);
                    padding: 8px;
                    color: var(--text-primary);
                    min-height: 100vh;
                    transition: background 0.3s ease, color 0.3s ease;
                }

                .container {
                    max-width: 1200px;
                    margin: 0 auto;
                }

                .header {
                    background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
                    padding: 12px 14px;
                    border-radius: 6px;
                    margin-bottom: 12px;
                    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    color: white;
                }

                .header h1 {
                    font-size: 20px;
                    font-weight: 700;
                    letter-spacing: -0.5px;
                }

                .header-controls {
                    display: flex;
                    gap: 6px;
                    align-items: center;
                    flex-wrap: wrap;
                }

                .timestamp {
                    color: rgba(255,255,255,0.85);
                    font-size: 12px;
                    font-weight: 500;
                }

                .section {
                    background: var(--bg-secondary);
                    border-radius: 8px;
                    padding: 8px 10px;
                    margin-bottom: 24px;
                    box-shadow: 0 2px 8px var(--shadow-light);
                    border-top: 3px solid #27ae60;
                }

                .section-title {
                    font-size: 18px;
                    font-weight: 700;
                    margin-bottom: 10px;
                    padding-bottom: 8px;
                    border-bottom: 2px solid #27ae60;
                    color: var(--text-primary);
                    letter-spacing: -0.3px;
                }

                /* BUTTONS */
                .btn {
                    border: none;
                    padding: 8px 14px;
                    border-radius: 6px;
                    cursor: pointer;
                    font-weight: 600;
                    font-size: 12px;
                    transition: all 0.3s ease;
                    text-transform: uppercase;
                    letter-spacing: 0.4px;
                    display: inline-flex;
                    align-items: center;
                    gap: 5px;
                }

                .btn-refresh {
                    background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
                    color: white;
                    box-shadow: 0 4px 8px rgba(39, 174, 96, 0.3);
                }

                .btn-refresh:hover:not(:disabled) {
                    transform: translateY(-2px);
                    box-shadow: 0 6px 12px rgba(39, 174, 96, 0.4);
                }

                .btn-export {
                    background: linear-gradient(135deg, #2980b9 0%, #2471a3 100%);
                    color: white;
                    box-shadow: 0 4px 8px rgba(41, 128, 185, 0.3);
                }

                .btn-export:hover:not(:disabled) {
                    transform: translateY(-2px);
                    box-shadow: 0 6px 12px rgba(41, 128, 185, 0.4);
                }

                .btn-info {
                    background: linear-gradient(135deg, #8e44ad 0%, #714fa6 100%);
                    color: white;
                    box-shadow: 0 4px 8px rgba(142, 68, 173, 0.3);
                }

                .btn-info:hover:not(:disabled) {
                    transform: translateY(-2px);
                    box-shadow: 0 6px 12px rgba(142, 68, 173, 0.4);
                }

                .btn-dark-mode {
                    background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
                    color: white;
                    box-shadow: 0 4px 8px rgba(243, 156, 18, 0.3);
                    font-size: 16px;
                }

                .btn-dark-mode:hover:not(:disabled) {
                    transform: translateY(-2px);
                    box-shadow: 0 6px 12px rgba(243, 156, 18, 0.4);
                }

                body.dark-mode .btn-dark-mode {
                    background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
                }

                .btn:disabled {
                    opacity: 0.6;
                    cursor: not-allowed;
                }

                /* PANELS LAYOUT */
                .panels-container {
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                }

                .panel-section {
                    display: grid;
                    grid-template-columns: 320px 1fr;
                    gap: 10px;
                    align-items: flex-start;
                    background: var(--bg-tertiary);
                    padding: 10px;
                    border-radius: 5px;
                    border-left: 3px solid #27ae60;
                }

                .panel-info {
                    border: 1px solid var(--border-color);
                    border-radius: 5px;
                    padding: 10px;
                    background: var(--bg-secondary);
                    box-shadow: 0 1px 3px var(--shadow-light);
                }

                .panel-info-header {
                    font-weight: 700;
                    font-size: 13px;
                    margin-bottom: 8px;
                    color: var(--text-primary);
                    padding-bottom: 6px;
                    border-bottom: 2px solid #27ae60;
                }

                .panel-info-row {
                    display: flex;
                    justify-content: flex-start;
                    font-size: 12px;
                    margin-bottom: 3px;
                    padding: 2px 0;
                    gap: 12px;
                    align-items: center;
                    flex-wrap: wrap;
                }

                .panel-info-label {
                    color: var(--text-secondary);
                    font-weight: 600;
                    min-width: auto;
                }

                .panel-info-value {
                    color: var(--text-primary);
                    font-weight: 700;
                    text-align: left;
                    font-size: 13px;
                }

                .panel-info-row.sin-campania {
                    background: #fff3cd;
                    padding: 6px 8px;
                    border-radius: 4px;
                    margin-top: 8px;
                    border-left: 3px solid #ffc107;
                }

                body.dark-mode .panel-info-row.sin-campania {
                    background: #664d1a;
                    color: #ffc107;
                }

                .panel-info-value.sin-campania {
                    color: #cc7c00;
                    font-size: 14px;
                }

                body.dark-mode .panel-info-value.sin-campania {
                    color: #ffc107;
                }

                /* Dark Mode Styles */
                body.dark-mode .section {
                    background: var(--bg-secondary);
                    box-shadow: 0 2px 8px var(--shadow-light);
                }

                body.dark-mode .campaign-bar {
                    background: var(--bg-secondary);
                    color: var(--text-primary);
                }

                body.dark-mode .campaign-bar.campaign-bar-paused {
                    background: #4a4a4a !important;
                    border-color: #555 !important;
                }

                body.dark-mode .campaign-bar.campaign-bar-paused .campaign-bar-name,
                body.dark-mode .campaign-bar.campaign-bar-paused .campaign-stat-label,
                body.dark-mode .campaign-bar.campaign-bar-paused .campaign-stat-value {
                    color: #d0d0d0 !important;
                }

                body.dark-mode .campaign-stat-item.asignar-input {
                    background: rgba(100, 150, 200, 0.15);
                    border: 1px solid rgba(100, 150, 200, 0.3);
                }

                body.dark-mode .campaign-stat-item.asignar-input input {
                    background: var(--bg-tertiary);
                    color: var(--text-primary);
                    border: 1px solid var(--border-color);
                }

                body.dark-mode .campaign-stat-item.asignar-input input:focus {
                    border-color: #5dade2;
                    box-shadow: 0 0 4px rgba(93, 173, 226, 0.3);
                }

                body.dark-mode .btn-asignar-add,
                body.dark-mode .btn-asignar-rest {
                    background: var(--bg-tertiary);
                    color: var(--text-primary);
                    border-color: var(--border-color);
                }

                body.dark-mode .campaign-stat-item.campaign-stat-landing {
                    background: rgba(80, 160, 100, 0.18);
                    border-color: rgba(120, 210, 140, 0.35);
                }

                body.dark-mode .input-landing-link {
                    background: var(--bg-tertiary);
                    color: var(--text-primary);
                    border: 1px solid var(--border-color);
                }

                body.dark-mode .btn-landing-link {
                    background: #1f8d4e;
                    border-color: #1a7742;
                }

                body.dark-mode .landing-link-feedback.ok {
                    color: #7fd7a3;
                }

                body.dark-mode .landing-link-feedback.warn {
                    color: #f7b267;
                }

                body.dark-mode .btn-asignar-add:hover {
                    background: #229954;
                    color: white;
                    border-color: #1e8449;
                }

                body.dark-mode .btn-asignar-rest:hover {
                    background: #c0392b;
                    color: white;
                    border-color: #a93226;
                }

                body.dark-mode .input-objetivo {
                    background: var(--bg-tertiary);
                    color: var(--text-primary);
                    border: 1px solid var(--border-color);
                }

                body.dark-mode .input-objetivo:focus {
                    border-color: #5dade2;
                    box-shadow: 0 0 4px rgba(93, 173, 226, 0.3);
                }

                body.dark-mode .btn-dark-mode {
                    background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
                }

                body.dark-mode .header-controls .timestamp {
                    color: var(--text-secondary);
                }

                body.dark-mode input[type="checkbox"] {
                    accent-color: #5dade2;
                }

                /* Dark Mode - Progress States */
                body.dark-mode .progreso-inicial {
                    background: rgba(160, 89, 77, 0.25);
                    color: #d9a09a;
                    border-color: rgba(160, 89, 77, 0.3);
                }

                body.dark-mode .progreso-bajo {
                    background: rgba(184, 112, 74, 0.25);
                    color: #e8b896;
                    border-color: rgba(184, 112, 74, 0.3);
                }

                body.dark-mode .progreso-medio {
                    background: rgba(201, 169, 97, 0.25);
                    color: #f5d986;
                    border-color: rgba(201, 169, 97, 0.3);
                }

                body.dark-mode .progreso-alto {
                    background: rgba(107, 157, 123, 0.25);
                    color: #9ecaa8;
                    border-color: rgba(107, 157, 123, 0.3);
                }

                body.dark-mode .progreso-completo {
                    background: rgba(90, 138, 106, 0.3);
                    color: #8db89e;
                    border-color: rgba(90, 138, 106, 0.35);
                }

                body.dark-mode .saldos-table thead {
                    background: linear-gradient(135deg, #3d4a53 0%, #2d3842 100%);
                }

                body.dark-mode .saldos-table tbody tr:hover {
                    background: var(--bg-tertiary);
                }

                body.dark-mode .saldos-table tbody td {
                    color: var(--text-primary);
                }

                body.dark-mode .alerta-sin-campania {
                    background: linear-gradient(135deg, #a93226 0%, #78260d 100%);
                    border-left-color: #c0392b;
                    box-shadow: 0 2px 8px rgba(231, 76, 60, 0.15);
                }

                /* ===== ALERTAS WHATSAPP ===== */

                    background: var(--bg-secondary);
                    border-radius: 8px;
                    padding: 8px 10px;
                    margin-bottom: 24px;
                    box-shadow: 0 2px 8px var(--shadow-light);
                    border-top: 3px solid #e74c3c;
                }

                .whatsapp-alerts-title {
                    font-size: 18px;

                    margin-bottom: 10px;
                    padding-bottom: 8px;
                    border-bottom: 2px solid #e74c3c;
                    color: var(--text-primary);
                    letter-spacing: -0.3px;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                }

                .whatsapp-alerts-badge {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    background: #e74c3c;
                    color: white;
                    border-radius: 50%;
                    width: 24px;
                    height: 24px;
                    font-size: 12px;
                    font-weight: 700;
                }

                .whatsapp-alert-item {
                    background: linear-gradient(135deg, #fadbd8 0%, #f5b7b1 100%);
                    border: 1px solid #e74c3c;
                    border-left: 4px solid #c0392b;
                    border-radius: 5px;
                    padding: 10px;
                    margin-bottom: 8px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    box-shadow: 0 2px 5px rgba(231, 76, 60, 0.1);
                }

                body.dark-mode .whatsapp-alert-item {
                    background: linear-gradient(135deg, #5d4037 0%, #3e2723 100%);
                    border-color: #d32f2f;
                }

                .whatsapp-alert-content {
                    flex: 1;
                }

                .whatsapp-alert-contact {
                    font-weight: 700;
                    color: #c0392b;
                    font-size: 13px;
                    margin-bottom: 3px;
                }

                body.dark-mode .whatsapp-alert-contact {
                    color: #ef5350;
                }

                .whatsapp-alert-message {
                    font-size: 11px;
                    color: var(--text-secondary);
                    margin-bottom: 3px;
                    font-style: italic;
                }

                .whatsapp-alert-time {
                    font-size: 10px;
                    color: #7f8c8d;
                }

                body.dark-mode .whatsapp-alert-time {
                    color: #9e9e9e;
                }

                .whatsapp-alert-actions {
                    display: flex;
                    gap: 5px;
                    margin-left: 10px;
                }

                .btn-resolve-alert {
                    background: #27ae60;
                    color: white;
                    border: none;
                    padding: 5px 10px;
                    border-radius: 4px;
                    cursor: pointer;
                    font-size: 11px;
                    font-weight: 600;
                    transition: all 0.3s ease;
                }

                .btn-resolve-alert:hover {
                    background: #229954;
                    transform: translateY(-1px);
                }

                .whatsapp-no-alerts {
                    text-align: center;
                    padding: 20px;
                    color: var(--text-secondary);
                    font-style: italic;
                }

                .asignaciones-list {
                    margin-top: 3px;
                    padding: 2px 0;
                }

                .asignacion-item {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 3px;
                    padding: 4px 3px;
                    font-size: 10px;
                    color: #27ae60;
                    border-bottom: 1px solid var(--border-color);
                }

                .asignacion-item:last-child {
                    border-bottom: none;
                }

                .asignacion-campania {
                    min-width: 45px;
                    font-weight: 600;
                }

                .asignacion-botones-compactos {
                    display: flex;
                    gap: 3px;
                }

                .btn-agregar-uno,
                .btn-restar-uno {
                    padding: 3px 6px;
                    font-size: 11px;
                    font-weight: bold;
                    border: 1px solid #ccc;
                    border-radius: 3px;
                    background: #ecf0f1;
                    cursor: pointer;
                    transition: all 0.15s ease;
                    min-width: 28px;
                    color: #2c3e50;
                }

                .btn-agregar-uno:hover:not(:disabled) {
                    background: #27ae60;
                    color: white;
                    border-color: #229954;
                }

                .btn-restar-uno:hover:not(:disabled) {
                    background: #e74c3c;
                    color: white;
                    border-color: #c0392b;
                }

                .btn-agregar-uno:disabled,
                .btn-restar-uno:disabled {
                    opacity: 0.4;
                    cursor: not-allowed;
                    background: #bdc3c7;
                    color: #7f8c8d;
                }

                /* Input delta (para sumar varios de una vez) */
                .asignacion-input-delta {
                    display: flex;
                    gap: 2px;
                    align-items: center;
                    order: -1;  /* Aparece primero */
                }

                .asignacion-input-delta input {
                    width: 50px;
                    padding: 4px;
                    font-size: 11px;
                    border: 1px solid #ccc;
                    border-radius: 2px;
                    text-align: center;
                    color: #2c3e50;
                    background: #fff;
                    font-weight: bold;
                }

                .asignacion-input-delta input:focus {
                    outline: none;

                    box-shadow: 0 0 4px rgba(52, 152, 219, 0.3);
                }

                .btn-input-mas {
                    padding: 3px 6px;
                    font-size: 11px;
                    font-weight: bold;
                    border: 1px solid #3498db;
                    border-radius: 2px;
                    background: #3498db;
                    color: white;
                    cursor: pointer;
                    min-width: 28px;
                    transition: all 0.15s ease;
                }

                .btn-input-menos:hover,
                .btn-input-mas:hover {
                    background: #2980b9;
                    border-color: #1f618d;
                }

                .btn-input-menos:disabled,
                .btn-input-mas:disabled {
                    opacity: 0.4;
                    cursor: not-allowed;
                    background: #bdc3c7;
                    border-color: #95a5a6;
                }

                /* Botón guardar todo */
                .asignaciones-footer {
                    padding: 5px 3px;
                    border-top: 1px solid var(--border-color);
                    display: flex;
                    justify-content: center;
                }

                .btn-guardar-todo {
                    padding: 5px 10px;
                    font-size: 10px;
                    font-weight: bold;
                    border: 1px solid #27ae60;
                    border-radius: 4px;
                    background: #27ae60;
                    color: white;
                    cursor: pointer;

                }

                body.dark-mode .btn-restar-uno:hover:not(:disabled) {

                body.dark-mode .btn-agregar-uno:disabled,

                    margin-left: auto;

                .asignacion-auto label {

                /**
                 * Renderizar resultados que no tienen relación directa con Meta Ads.
                 * Se muestran en un bloque aparte, fuera del panel 463.
                 */
                function renderizarCampaniasSinDatosCRM() {
                    const campaniasMetaAds = datosGlobales.campaniasMetaAds?.datos || [];

                    const { campanas: campaniasPorPanel } = agruparCampaniasPorPanelConUsuario();
                    const campaniasMapeadas = new Set();
                    Object.values(campaniasPorPanel).forEach(campañas => {
                        campañas.forEach(c => campaniasMapeadas.add(c.id));
                    });

                    const campaniasSinMapeo = [];
                    campaniasMetaAds.forEach(usuario => {
                        usuario.cuentas?.forEach(cuenta => {
                            cuenta.campanias?.forEach(campania => {
                                const gasto = parseFloat(campania.metricas_diarias?.spend || 0);
                                if (gasto > 0 && !campaniasMapeadas.has(campania.id)) {
                                    campaniasSinMapeo.push({
                                        ...campania,
                                        usuario: usuario.nombre,
                                        cuenta: cuenta.id
                                    });
                                }
                            });
                        });
                    });

                    if (campaniasSinMapeo.length === 0) {
                        return '';
                    }

                    let html = '<div class="section">';
                    html += '<div class="section-title">⚠️ Resultados sin relación con Meta Ads</div>';
                    html += '<div class="section-subtitle">Bloque aparte para revisar campañas que no entran en el panel 463.</div>';
                    html += '<div class="panels-container">';

                    const porUsuario = {};
                    campaniasSinMapeo.forEach(campania => {
                        if (!porUsuario[campania.usuario]) {
                            porUsuario[campania.usuario] = [];
                        }
                        porUsuario[campania.usuario].push(campania);
                    });

                    Object.entries(porUsuario).forEach(([usuario, campanias]) => {
                        html += '<div class="panel-section" style="grid-template-columns: 1fr;">';
                        html += '<div class="panel-info">';
                        html += '<div class="panel-info-header" style="background-color: #fff3cd; color: #856404;">👤 ' + usuario + '</div>';
                        html += '</div>';
                        html += '<div>';
                        html += '<div class="campaigns-list">';

                        let totalGasto = 0;
                        let totalMensajes = 0;

                        campanias.forEach(campania => {
                            const metricas = campania.metricas_diarias || {};
                            const gasto = parseFloat(metricas.spend || 0);
                            const adsMensajes = metricas.messages || 0;
                            const estado = campania.estado === 'ACTIVE' ? 'Activa' : 'Pausada';
                            const costoPorMensaje = adsMensajes > 0 ? gasto / adsMensajes : 0;

                            totalGasto += gasto;
                            totalMensajes += adsMensajes;

                            const colorClass = getColorClassForPrice(costoPorMensaje);
                            const bgClass = getBackgroundClassForPrice(costoPorMensaje);
                            const isPaused = campania.estado !== 'ACTIVE';
                            const pausedClass = isPaused ? 'campaign-bar-paused' : '';

                            html += '<div class="campaign-bar ' + bgClass + ' ' + pausedClass + '">'
                                + '<span class="campaign-bar-name">' + campania.nombre + '</span>'
                                + '<div class="campaign-bar-stats">'
                                + '<div class="campaign-stat-item">'
                                + '<span class="campaign-stat-label">Gasto</span>'
                                + '<span class="campaign-stat-value">$' + gasto.toFixed(2) + '</span>'
                                + '</div>'
                                + '<div class="campaign-stat-item">'
                                + '<span class="campaign-stat-label">Ads</span>'
                                + '<span class="campaign-stat-value">' + adsMensajes + '</span>'
                                + '</div>'
                                + '<div class="campaign-stat-item ' + colorClass + '">'
                                + '<span class="campaign-stat-label">$ / Msg</span>'
                                + '<span class="campaign-stat-value">$' + costoPorMensaje.toFixed(2) + '</span>'
                                + '</div>'
                                + '<div class="campaign-stat-item">'
                                + '<span class="campaign-stat-label">Estado</span>'
                                + '<span class="campaign-stat-value ' + (estado === 'Activa' ? 'estado-activo' : 'estado-pausado') + '">' + estado + '</span>'
                                + '</div>'
                                + '</div>'
                                + '</div>';
                        });

                        html += '</div>';

                        if (campanias.length > 0) {
                            const costoPorMensajePromedio = totalMensajes > 0 ? totalGasto / totalMensajes : 0;
                            const claseProgreso = costoPorMensajePromedio < 0.5 ? 'progreso-completo' : 
                                                costoPorMensajePromedio < 1.0 ? 'progreso-alto' :
                                                costoPorMensajePromedio < 1.5 ? 'progreso-medio' : 'progreso-bajo';

                            html += '<div class="totales-cargas ' + claseProgreso + '">'
                                + '💰 <span class="totales-label">Gasto Total</span>: <span class="totales-valor">$' + totalGasto.toFixed(2) + '</span>'
                                + ' | 📨 <span class="totales-label">Mensajes</span>: <span class="totales-valor">' + totalMensajes + '</span>'
                                + ' | 📊 <span class="totales-label">Promedio</span>: <span class="totales-valor">$' + costoPorMensajePromedio.toFixed(2) + '</span>'
                                + '</div>';
                        }

                        html += '</div>';
                        html += '</div>';
                    });

                    html += '</div></div>';
                    return html;
                }

                /* ESTILOS PARA ASIGNACIÓN DE MENSAJES */
                .asignacion-section {

                .asignacion-title {

                .sin-campania-count {

                .campania-form {
                    background: var(--bg-secondary);

                .campania-auto {

                .campania-auto input[type="checkbox"] {

                .btn-guardar-asignaciones {
                    background: linear-gradient(135deg, #2980b9 0%, #2471a3 100%);

                    border: none;

                    border-radius: 4px;

                .btn-guardar-asignaciones:hover:not(:disabled) {

                .btn-guardar-asignaciones-panel:disabled {

                /* ===== ESTILOS PARA ADSETS (SUB-FILAS) ===== */
                .campaign-adset-row {
                    background: var(--bg-secondary);
                    padding: 6px 8px;

                    border-radius: 3px;
                    border: 1px solid var(--border-color);

                    flex-wrap: wrap;

                .campaign-adset-row:first-child {
                    margin-top: 8px;
                }

                .campaign-adset-row:last-child {
                    margin-bottom: 8px;
                }

                .campaign-adset-row:hover {
                    background: var(--bg-secondary);
                    border-color: var(--text-secondary);

                .adset-name {
                    flex: 1;
                    min-width: 150px;
                    font-weight: 600;
                    color: var(--text-primary);
                    font-size: 10px;

                .adset-stat {
                    display: flex;

                    text-transform: uppercase;

                @media print {
                    body {
                        background: white;
                    }
                    .header-controls,
                    .btn {
                        display: none;

                }
            </style>

        <body>
            <div class="container">
                <div class="header">
                    <div>
                        <h1>INFORME V3</h1>
                    </div>
                    <div class="header-controls">
                        <div class="timestamp" id="timestamp">Cargando...</div>
                        <button class="btn btn-refresh" id="refreshBtn" onclick="cargarDatos()">🔄 Actualizar</button>
                        <button class="btn btn-export" id="exportBtn" onclick="exportarPNG()">📥 Descargar PNG</button>
                        <button class="btn btn-info" onclick="window.open('https://informaciongeneral.vercel.app/', '_blank')">📈 Informe General</button>
                        <button class="btn btn-info" onclick="window.open('https://buscadoretiquetas.vercel.app/', '_blank')">🏷️ Buscador Etiquetas</button>
                        <button class="btn btn-dark-mode" id="darkModeBtn" onclick="toggleDarkMode()" title="Modo Oscuro">🌙</button>
                    </div>
                </div>

                <div id="successMsg" class="success"></div>
                <div id="timestampBox" class="timestamp-box" style="display: none;"></div>

                <!-- ✅ NUEVO: Sección de Alertas WhatsApp -->
                <div id="whatsappAlertsSection" class="whatsapp-alerts-container" style="display: none;">
                    <div class="whatsapp-alerts-title">
                        📱 Alertas WhatsApp
                        <span class="whatsapp-alerts-badge" id="alertsCount">0</span>
                    </div>
                    <div id="whatsappAlertsList"></div>
                </div>

                <div id="content">
                    <div class="loading">⏳ Cargando datos...</div>
                </div>
            </div>

            <script>
                const CONFIG = {
                    ENDPOINT: "https://higienixservicios.com/root/superbot1.0",
                    API_KEY: "clave-super-secreta",
                    REFRESH_INTERVAL: 180000
                };

                let datosGlobales = {};
                let ultimaActualizacion = null;
                let autoRefreshId = null;
                const STORAGE_KEY_GASTOS_SIN_META = 'gastos_sin_meta_manual';
                const STORAGE_KEY_NOMBRES_SIN_META = 'nombres_sin_meta_manual';
                const STORAGE_KEY_ESTADO_SIN_META = 'estado_sin_meta_pausada';
                const STORAGE_KEY_LANDING_463 = 'landing_463_por_campania';
                const STORAGE_KEY_ASIGNACIONES_463 = 'asignaciones_463_por_campania';

                // ========== FUNCIONES AUXILIARES ==========

                function formatearMoneda(valor) {
                    return new Intl.NumberFormat('es-AR', {
                        style: 'currency',
                        currency: 'ARS',
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(valor);
                }

                function normalizarNombre(nombre) {
                    if (!nombre) return '';
                    return nombre
                        .trim()
                        .toLowerCase()
                        .replace(/\s+/g, '');
                }

                function cargarGastosSinMeta() {
                    try {
                        const raw = localStorage.getItem(STORAGE_KEY_GASTOS_SIN_META);
                        return raw ? JSON.parse(raw) : {};
                    } catch (error) {
                        console.warn('⚠️ No se pudo leer gastos manuales sin Meta:', error);
                        return {};
                    }
                }

                function guardarGastosSinMeta(data) {
                    try {
                        localStorage.setItem(STORAGE_KEY_GASTOS_SIN_META, JSON.stringify(data));
                    } catch (error) {
                        console.warn('⚠️ No se pudo guardar gastos manuales sin Meta:', error);
                    }
                }

                function cargarNombresSinMeta() {
                    try {
                        const raw = localStorage.getItem(STORAGE_KEY_NOMBRES_SIN_META);
                        return raw ? JSON.parse(raw) : {};
                    } catch (error) {
                        console.warn('⚠️ No se pudo leer nombres manuales sin Meta:', error);
                        return {};
                    }
                }

                function guardarNombresSinMeta(data) {
                    try {
                        localStorage.setItem(STORAGE_KEY_NOMBRES_SIN_META, JSON.stringify(data));
                    } catch (error) {
                        console.warn('⚠️ No se pudo guardar nombres manuales sin Meta:', error);
                    }
                }

                function cargarLanding463Map() {
                    try {
                        const raw = localStorage.getItem(STORAGE_KEY_LANDING_463);
                        return raw ? JSON.parse(raw) : {};
                    } catch (error) {
                        console.warn('⚠️ No se pudo leer mapeo landing 463:', error);
                        return {};
                    }
                }

                function guardarLanding463Map(data) {
                    try {
                        localStorage.setItem(STORAGE_KEY_LANDING_463, JSON.stringify(data));
                    } catch (error) {
                        console.warn('⚠️ No se pudo guardar mapeo landing 463:', error);
                    }
                }

                function normalizarLanding463(texto) {
                    return String(texto || '')
                        .toLowerCase()
                        .trim()
                        .replace(/[^a-z0-9]/g, '');
                }

                function obtenerLandingAsignada463(campaniaId) {
                    const mapa = cargarLanding463Map();
                    const clave = String(campaniaId || '').trim();
                    return (mapa[clave] || '').toString();
                }

                function guardarLandingAsignada463(campaniaId, landing) {
                    const mapa = cargarLanding463Map();
                    const clave = String(campaniaId || '').trim();
                    const valor = String(landing || '').trim();

                    if (!clave) return;

                    if (valor) {
                        mapa[clave] = valor;
                    } else {
                        delete mapa[clave];
                    }

                    guardarLanding463Map(mapa);
                }

                function obtenerPanel463() {
                    const paneles = Array.isArray(datosGlobales.reportePaneles) ? datosGlobales.reportePaneles : [];
                    return paneles.find(p => String(p.id || '') === '463' || normalizarNombre(String(p.panel || '')) === '463') || null;
                }

                function obtenerMetricasLanding463(landingInput) {
                    const panel463 = obtenerPanel463();
                    if (!panel463 || !panel463.campañas) {
                        return { encontrada: false, nombre: '', mensajes: 0, cargas: 0 };
                    }

                    const campañas = panel463.campañas;
                    const entradaNormalizada = normalizarLanding463(landingInput);
                    if (!entradaNormalizada) {
                        return { encontrada: false, nombre: '', mensajes: 0, cargas: 0 };
                    }

                    const claves = Object.keys(campañas);
                    let buscada = entradaNormalizada;

                    if (/^\d+$/.test(buscada)) {
                        buscada = `landing${buscada}`;
                    }

                    let nombreReal = claves.find(nombre => normalizarLanding463(nombre) === buscada);

                    if (!nombreReal) {
                        nombreReal = claves.find(nombre => {
                            const nomNorm = normalizarLanding463(nombre);
                            return nomNorm.includes(buscada) || buscada.includes(nomNorm);
                        });
                    }

                    if (!nombreReal) {
                        return { encontrada: false, nombre: '', mensajes: 0, cargas: 0 };
                    }

                    const datosCampania = campañas[nombreReal] || {};
                    return {
                        encontrada: true,
                        nombre: nombreReal,
                        mensajes: parseInt(datosCampania.mensajes || 0, 10),
                        cargas: parseInt(datosCampania.cargas || 0, 10)
                    };
                }

                function actualizarLandingAsignadaDesdeInput(campaniaId, inputId, feedbackId) {
                    const input = document.getElementById(inputId);
                    const feedback = document.getElementById(feedbackId);
                    if (!input || !feedback) return;

                    const landing = (input.value || '').trim();
                    guardarLandingAsignada463(campaniaId, landing);

                    const metricas = obtenerMetricasLanding463(landing);
                    if (metricas.encontrada) {
                        feedback.textContent = `Asociada a ${metricas.nombre}: ${metricas.mensajes} CLY | ${metricas.cargas} cargas`;
                        feedback.classList.remove('warn');
                        feedback.classList.add('ok');
                    } else if (landing) {
                        feedback.textContent = 'Landing guardada pero sin coincidencia en panel 463';
                        feedback.classList.remove('ok');
                        feedback.classList.add('warn');
                    } else {
                        feedback.textContent = 'Sin landing asignada';
                        feedback.classList.remove('ok');
                        feedback.classList.add('warn');
                    }
                }

                function guardarLandingConEnter(event, campaniaId, inputId, feedbackId) {
                    if (event.key !== 'Enter') return;
                    event.preventDefault();
                    actualizarLandingAsignadaDesdeInput(campaniaId, inputId, feedbackId);
                }

                function cargarAsignacionesCampanias463() {
                    try {
                        const raw = localStorage.getItem(STORAGE_KEY_ASIGNACIONES_463);
                        return raw ? JSON.parse(raw) : {};
                    } catch (error) {
                        console.warn('⚠️ No se pudo leer asignaciones 463:', error);
                        return {};
                    }
                }

                function guardarAsignacionesCampanias463(data) {
                    try {
                        localStorage.setItem(STORAGE_KEY_ASIGNACIONES_463, JSON.stringify(data));
                    } catch (error) {
                        console.warn('⚠️ No se pudo guardar asignaciones 463:', error);
                    }
                }

                function normalizarClaveCampania463(campaniaId) {
                    return String(campaniaId || '').trim();
                }

                function obtenerAsignacionCampania463(campaniaId) {
                    const mapa = cargarAsignacionesCampanias463();
                    const clave = normalizarClaveCampania463(campaniaId);
                    return mapa[clave] || { landing: '', mensajes: '' };
                }

                function guardarAsignacionCampania463(campaniaId, landing, mensajes) {
                    const mapa = cargarAsignacionesCampanias463();
                    const clave = normalizarClaveCampania463(campaniaId);
                    if (!clave) return;

                    const landingLimpia = String(landing || '').trim();
                    const mensajesNumericos = Math.max(0, parseInt(mensajes || 0, 10) || 0);

                    if (landingLimpia || mensajesNumericos > 0) {
                        mapa[clave] = {
                            landing: landingLimpia,
                            mensajes: mensajesNumericos
                        };
                    } else {
                        delete mapa[clave];
                    }

                    guardarAsignacionesCampanias463(mapa);
                }

                function actualizarAsignacionCampania463DesdeInputs(campaniaId, selectId, inputId, feedbackId) {
                    const select = document.getElementById(selectId);
                    const input = document.getElementById(inputId);
                    const feedback = document.getElementById(feedbackId);
                    if (!select || !input || !feedback) return;

                    const landing = (select.value || '').trim();
                    const metricasLanding = obtenerMetricasLanding463(landing);
                    const mensajes = Math.max(0, parseInt(input.value || metricasLanding.mensajes || 0, 10) || 0);

                    if (!landing) {
                        feedback.textContent = 'Elegí una landing 463';
                        feedback.classList.remove('ok');
                        feedback.classList.add('warn');
                        return;
                    }

                    guardarAsignacionCampania463(campaniaId, landing, mensajes);

                    const landingTexto = metricasLanding.encontrada ? `${metricasLanding.nombre}: ${metricasLanding.mensajes} mensajes` : landing;
                    feedback.textContent = `Guardado: ${landingTexto} | Asignados: ${mensajes}`;
                    feedback.classList.remove('warn');
                    feedback.classList.add('ok');

                    renderizarDashboard();
                }

                function guardarAsignacionCampania463ConEnter(event, campaniaId, selectId, inputId, feedbackId) {
                    if (event.key !== 'Enter') return;
                    event.preventDefault();
                    actualizarAsignacionCampania463DesdeInputs(campaniaId, selectId, inputId, feedbackId);
                }

                // ===== FUNCIONES PARA ESTADO (ACTIVA/PAUSADA) DE CAMPAÑAS SIN META =====
                function cargarEstadoSinMeta() {
                    try {
                        const raw = localStorage.getItem(STORAGE_KEY_ESTADO_SIN_META);
                        return raw ? JSON.parse(raw) : {};
                    } catch (error) {
                        console.warn('⚠️ No se pudo leer estado sin Meta:', error);
                        return {};
                    }
                }

                function guardarEstadoSinMeta(data) {
                    try {
                        localStorage.setItem(STORAGE_KEY_ESTADO_SIN_META, JSON.stringify(data));
                    } catch (error) {
                        console.warn('⚠️ No se pudo guardar estado sin Meta:', error);
                    }
                }

                function obtenerEstadoSinMeta(panelId, campaniaKey) {
                    const estados = cargarEstadoSinMeta();
                    const clave = `${panelId}::${campaniaKey}`;
                    // Retorna true si está pausada, false si está activa
                    return estados[clave] === true;
                }

                function toggleEstadoSinMeta(panelId, campaniaKey) {
                    const estados = cargarEstadoSinMeta();
                    const clave = `${panelId}::${campaniaKey}`;
                    estados[clave] = !estados[clave];
                    guardarEstadoSinMeta(estados);
                    return estados[clave];
                }

                function obtenerGastoManualSinMeta(panelId, campaniaKey) {
                    const gastos = cargarGastosSinMeta();
                    const clave = `${panelId}::${campaniaKey}`;
                    return parseFloat(gastos[clave] || 0);
                }

                function obtenerNombreManualSinMeta(panelId, campaniaKey) {
                    const nombres = cargarNombresSinMeta();
                    const clave = `${panelId}::${campaniaKey}`;
                    return (nombres[clave] || '').toString();
                }

                function actualizarNombreSinMetaDesdeInput(input) {
                    if (!input) return;

                    const panelId = input.getAttribute('data-panel-id') || '';
                    const campaniaKey = decodeURIComponent(input.getAttribute('data-campania-key') || '');
                    const valor = (input.value || '').trim();

                    const nombres = cargarNombresSinMeta();
                    const clave = `${panelId}::${campaniaKey}`;

                    if (valor) {
                        nombres[clave] = valor;
                    } else {
                        delete nombres[clave];
                    }

                    guardarNombresSinMeta(nombres);
                }

                function actualizarGastoSinMetaDesdeInput(input) {
                    if (!input) return;

                    const panelId = input.getAttribute('data-panel-id') || '';
                    const campaniaKey = decodeURIComponent(input.getAttribute('data-campania-key') || '');
                    const mensajes = parseInt(input.getAttribute('data-mensajes') || '0', 10);
                    const valorLimpio = (input.value || '').replace(',', '.');
                    const gasto = Math.max(0, parseFloat(valorLimpio) || 0);

                    const gastos = cargarGastosSinMeta();
                    gastos[`${panelId}::${campaniaKey}`] = gasto;
                    guardarGastosSinMeta(gastos);

                    const fila = input.closest('.campaign-bar-sin-meta');
                    if (!fila) return;

                    const costo = mensajes > 0 ? gasto / mensajes : 0;
                    const costoEl = fila.querySelector('.costo-manual-sin-meta');
                    const costoWrap = fila.querySelector('.costo-manual-wrapper');

                    if (costoEl) {
                        costoEl.textContent = `$${costo.toFixed(2)}`;
                    }

                    if (costoWrap) {
                        costoWrap.classList.remove('precio-verde', 'precio-amarillo', 'precio-naranja', 'precio-rojo');
                        costoWrap.classList.add(getColorClassForPrice(costo));
                    }
                }

                function validarDatosVPS(data) {
                    if (!data.success) {
                        throw new Error("❌ Respuesta con success = false");
                    }
                    // ✅ CAMBIO: Permitir reportePaneles vacío (solo Meta cuando no hay Clientify)
                    if (!Array.isArray(data.reportePaneles)) {
                        throw new Error("❌ reportePaneles debe ser un array");
                    }
                    if (!data.campaniasMetaAds || !data.campaniasMetaAds.datos) {
                        throw new Error("❌ campaniasMetaAds.datos ausente");
                    }
                    // ✅ CAMBIO: horariosMetaAds no es requerido, usar fecha actual si no existe
                    return true;
                }

                function obtenerSaldosRestantes(campaniasMetaAds) {
                    const saldosRestantes = {};
                    const usuarios = campaniasMetaAds.datos || [];

                    usuarios.forEach(usuario => {
                        const nombreDueño = normalizarNombre(usuario.nombre);
                        saldosRestantes[nombreDueño] = 0;

                        if (Array.isArray(usuario.cuentas)) {
                            usuario.cuentas.forEach(cuenta => {
                                const spendCap = parseFloat(cuenta.saldos?.spend_cap) || 0;
                                const amountSpent = parseFloat(cuenta.saldos?.amount_spent) || 0;
                                saldosRestantes[nombreDueño] += (spendCap - amountSpent) / 100;
                            });
                        }
                    });

                    return saldosRestantes;
                }

                async function cargarDatos() {
                    const contentDiv = document.getElementById('content');
                    const refreshBtn = document.getElementById('refreshBtn');
                    
                    if (refreshBtn) refreshBtn.disabled = true;

                    try {
                        contentDiv.innerHTML = '<div class="loading">⏳ Conectando con servidor...</div>';
                        
                        let datos = await fetchDesdeVPS();
                        
                        datosGlobales = datos;
                        ultimaActualizacion = new Date();
                        
                        renderizarDashboard();
                        mostrarUltimaActualizacion();
                        iniciarAutoRefresh();
                        
                        // ✅ NUEVO: Cargar alertas de WhatsApp después de renderizar dashboard
                        cargarAlertasWhatsApp();
                        
                    } catch (error) {
                        console.error('Error:', error);
                        
                        contentDiv.innerHTML = 
                            `<div class="error">
                                <strong>❌ ERROR DE CONEXIÓN CON EL SERVIDOR</strong><br><br>
                                <strong>Endpoint:</strong> ${CONFIG.ENDPOINT}<br>
                                <strong>Motivo:</strong> ${error.message}<br><br>
                                <small>Verifica:</small>
                                <ul>
                                    <li>Que el servidor VPS esté disponible</li>
                                    <li>La URL del endpoint</li>
                                    <li>La conectividad de red</li>
                                </ul>

                /**
                 * Renderizar campañas de Meta que NO están mapeadas a ningún panel
                 * Aparece cuando hay datos parciales de Clientify
                 */
                function renderizarCampaniasSinDatosCRM() {
                    const campaniasMetaAds = datosGlobales.campaniasMetaAds?.datos || [];
                    
                    // Obtener campañas ya mapeadas
                    const { campanas: campaniasPorPanel } = agruparCampaniasPorPanelConUsuario();
                    const campaniasMapeadas = new Set();
                    Object.values(campaniasPorPanel).forEach(campañas => {
                        campañas.forEach(c => campaniasMapeadas.add(c.id));
                    });

                    // Encontrar campañas sin mapeo
                    const campaniasSinMapeo = [];
                    campaniasMetaAds.forEach(usuario => {
                        usuario.cuentas?.forEach(cuenta => {
                            cuenta.campanias?.forEach(campania => {
                                const gasto = parseFloat(campania.metricas_diarias?.spend || 0);
                                if (gasto > 0 && !campaniasMapeadas.has(campania.id)) {
                                    campaniasSinMapeo.push({
                                        ...campania,
                                        usuario: usuario.nombre,
                                        cuenta: cuenta.id
                                    });
                                }
                            });
                        });
                    });

                    if (campaniasSinMapeo.length === 0) {
                        return '';
                    }

                    let html = '<div class="section">';
                    html += '<div class="section-title">⚠️ Campañas Sin Datos de CRM</div>';
                    html += '<div class="panels-container">';

                    // Agrupar por usuario
                    const porUsuario = {};
                    campaniasSinMapeo.forEach(campania => {
                        if (!porUsuario[campania.usuario]) {
                            porUsuario[campania.usuario] = [];
                        }
                        porUsuario[campania.usuario].push(campania);
                    });

                    Object.entries(porUsuario).forEach(([usuario, campanias]) => {
                        html += '<div class="panel-section" style="grid-template-columns: 1fr;">';
                        html += '<div class="panel-info">';
                        html += '<div class="panel-info-header" style="background-color: #fff3cd; color: #856404;">👤 ' + usuario + '</div>';
                        html += '</div>';
                        html += '<div>';
                        html += '<div class="campaigns-list">';

                        let totalGasto = 0;
                        let totalMensajes = 0;

                        campanias.forEach((campania, index) => {
                            const metricas = campania.metricas_diarias || {};
                            const gasto = parseFloat(metricas.spend || 0);
                            const adsMensajes = metricas.messages || 0;
                            const estado = campania.estado === 'ACTIVE' ? 'Activa' : 'Pausada';

                            const campaniaStorageKey = `meta::${String(campania.id || campania.nombre || `camp_${index}`)}`;
                            const landingAsignada = obtenerLandingAsignada463(campaniaStorageKey);
                            const metricasAsociadas463 = obtenerMetricasLanding463(landingAsignada);
                            const idBase = String(campania.id || index).replace(/[^a-zA-Z0-9_-]/g, '_');
                            const landingInputId = `landing-input-${idBase}`;
                            const landingFeedbackId = `landing-feedback-${idBase}`;
                            const landingValorSafe = landingAsignada.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
                            const campaniaStorageKeyJs = campaniaStorageKey.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                            const landingInfo = metricasAsociadas463.encontrada
                                ? `Asociada a ${metricasAsociadas463.nombre}: ${metricasAsociadas463.mensajes} CLY | ${metricasAsociadas463.cargas} cargas`
                                : (landingAsignada ? 'Landing guardada pero sin coincidencia en panel 463' : 'Sin landing asignada');
                            const landingClass = metricasAsociadas463.encontrada ? 'ok' : 'warn';

                            const clyMensajes = metricasAsociadas463.encontrada ? metricasAsociadas463.mensajes : 0;
                            const clyCargas = metricasAsociadas463.encontrada ? metricasAsociadas463.cargas : 0;
                            const denominadorCosto = clyMensajes > 0 ? clyMensajes : adsMensajes;
                            const costoPorMensaje = denominadorCosto > 0 ? gasto / denominadorCosto : 0;

                            totalGasto += gasto;
                            totalMensajes += adsMensajes;

                            const colorClass = getColorClassForPrice(costoPorMensaje);
                            const bgClass = getBackgroundClassForPrice(costoPorMensaje);

                            html += '<div class="campaign-bar ' + bgClass + ' ' + pausedClass + '">'

                    html += '<div class="panels-container">';

                    const { campanas: campaniasPorPanel, usuarios: usuariosPanel } = agruparCampaniasPorPanelConUsuario();

                    datosGlobales.reportePaneles.forEach(panel => {
                        // ✅ NUEVO: No mostrar panel Cyber (código 0)

                /**
                 * Enriquecer campañas con datos de reportePaneles
                 * ✅ FIX: Evitar mapeos múltiples - cada campaña se mapea a UN ÚNICO panel
                 * ✅ Funciona incluso cuando reportePaneles está vacío
                 */
                function agruparCampaniasPorPanelConUsuario() {
                    const mapeo = {};
                    const usuariosPanel = {};
                    const campaniasMetaAds = datosGlobales.campaniasMetaAds?.datos || [];
                    const campaniasMapeadas = new Set();  // Track qué campañas ya fueron mapeadas
                    const reportePanelesOriginal = datosGlobales.reportePanelesOriginal || [];

                    function normalizarTextoComparacion(texto) {
                        return (texto || '')
                            .normalize('NFD')
                            .replace(/[\u0300-\u036f]/g, '')
                            .toLowerCase()
                            .replace(/[^a-z0-9\s]/g, ' ')
                            .replace(/\s+/g, ' ')
                            .trim();
                    }

                    function tieneCoincidenciaCampaniaValida(nombreCampaniaPanel, nombreCampaniaMeta) {
                        const panelNormalizado = normalizarTextoComparacion(nombreCampaniaPanel);
                        const metaNormalizado = normalizarTextoComparacion(nombreCampaniaMeta);

                        if (!panelNormalizado || !metaNormalizado) return false;
                        if (panelNormalizado === metaNormalizado) return true;
                        if (panelNormalizado.includes(metaNormalizado) || metaNormalizado.includes(panelNormalizado)) return true;

                        const palabrasPanel = panelNormalizado
                            .split(' ')
                            .filter(p => p.length >= 2 && !/^\d+$/.test(p));
                        const palabrasMeta = metaNormalizado
                            .split(' ')
                            .filter(p => p.length >= 2 && !/^\d+$/.test(p));

                        if (palabrasPanel.length === 0 || palabrasMeta.length === 0) return false;

                        const palabrasComunes = palabrasPanel.filter(p => palabrasMeta.includes(p));
                        return palabrasComunes.length >= 2;
                    }

                    // ✅ NUEVO: Helper para detectar si campaña es WTK o CLY
                    function detectarFuenteCampania(nombreCampania, panel) {
                        // Si tiene LETRA (A, B, C...) dentro del nombre = CLY (Clientify)
                        const letraMatch = nombreCampania.match(/-([A-Z])-/i);
                        if (letraMatch && letraMatch[1]) {
                            // Es una letra sola = CLY
                            return 'CLY';
                        }

                        // Si tiene NOMBRE completo (múltiples palabras) = WTK (Whaticket)
                        // Por ejemplo: "Invest In Gabon", "Miami Real State", etc.
                        const nombreLimpio = nombreCampania.toLowerCase().trim();
                        // Si tiene espacios en blanco y no es solo una letra = es un nombre completo
                        if (nombreLimpio.includes(' ') || nombreLimpio.length > 3) {
                            return 'WTK';
                        }

                        // Por defecto CLY si no es identifiable
                        return 'CLY';
                    }

                    // Para cada usuario (cuenta de Meta Ads)
                    campaniasMetaAds.forEach(usuario => {
                        const nombreUsuario = usuario.nombre;
                        
                        // Para cada cuenta del usuario
                        usuario.cuentas?.forEach(cuenta => {
                            // Para cada campaña en la cuenta
                            cuenta.campanias?.forEach(campania => {
                                // ✅ NOVO: Si ya fue mapeada, saltar
                                const campaniaId = `${campania.id}`;
                                if (campaniasMapeadas.has(campaniaId)) {
                                    return;
                                }

                                const campaniaName = campania.nombre.toLowerCase().trim();
                                const userName = nombreUsuario.toLowerCase().trim();

                                // ✅ PASO 1: Buscar si la campaña contiene EXPLÍCITAMENTE un nombre de panel
                                let panelPorNombre = null;
                                datosGlobales.reportePaneles?.forEach(panel => {
                                    const panelName = panel.panel.toLowerCase().trim();
                                    // Buscar si el panel name está en la campaña (prioritario)
                                    if (campaniaName.includes(panelName) && (!panelPorNombre || panelName.length > panelPorNombre.panel.toLowerCase().length)) {
                                        panelPorNombre = panel;
                                    }
                                });

                                let campaniaEncontrada = false;
                                
                                // ✅ PASO 2: Si encontramos panel por nombre, mapear SOLO a ese
                                // NO hacer match por usuario si ya hay un panel explícito
                                if (panelPorNombre) {
                                    campaniaEncontrada = true;
                                    campaniasMapeadas.add(campaniaId);
                                    
                                    const panel = panelPorNombre;
                                    if (!mapeo[panel.panel]) {
                                        mapeo[panel.panel] = [];
                                        usuariosPanel[panel.panel] = nombreUsuario;
                                    }
                                    
                                    // Buscar datos de cargas
                                    let clyParaCampania = 0;
                                    let cargasParaCampania = 0;
                                    
                                    // 🔍 PASO 1: Buscar por LETRA (A, B, C...)
                                    const letraMatch = campaniaName.match(/-([a-z])-/i);
                                    if (letraMatch && letraMatch[1]) {
                                        const letraBuscada = letraMatch[1].toUpperCase();
                                        if (panel.campañas && panel.campañas[letraBuscada]) {
                                            const datosLetra = panel.campañas[letraBuscada];
                                            clyParaCampania = datosLetra.mensajes || 0;
                                            cargasParaCampania = datosLetra.cargas || 0;
                                        }
                                    }
                                    
                                    // 🔍 PASO 2: Si no encontró por letra, buscar por NOMBRE (para whaticket)
                                    if (clyParaCampania === 0 && panel.campañas) {
                                        for (const [nombreCampaniaPanel, datosPanel] of Object.entries(panel.campañas)) {
                                            // Ignorar si es solo una letra (ej: "F", "A", "B")
                                            if (nombreCampaniaPanel.length === 1 || nombreCampaniaPanel === 'SIN_CAMPAÑA') {
                                                continue;
                                            }
                                            
                                            // Match tolerante: ignora símbolos/acentos y soporta pequeñas variaciones de texto.
                                            const nombreNormalizado = normalizarTextoComparacion(nombreCampaniaPanel);
                                            const campaniaNameNormalizado = normalizarTextoComparacion(campaniaName);

                                            const matchValido = tieneCoincidenciaCampaniaValida(nombreNormalizado, campaniaNameNormalizado);
                                            if (matchValido) {
                                                clyParaCampania = datosPanel.mensajes || 0;
                                                cargasParaCampania = datosPanel.cargas || 0;
                                                break;
                                            }
                                        }
                                    }
                                    
                                    mapeo[panel.panel].push({
                                        ...campania,
                                        usuario: nombreUsuario,
                                        cly_para_campania: clyParaCampania,
                                        cargas_para_campania: cargasParaCampania,
                                        fuente_origen: detectarFuenteCampania(campaniaName, panel)  // ✅ NUEVO
                                    });
                                } else {
                                    // Sin fallback por usuario: si no hay match explícito por panel,
                                    // dejamos la campaña sin asignar para que vaya a "⚠️ Campañas Sin Datos de CRM".
                                }
                                
                                if (!campaniaEncontrada) {
                                    console.warn(`⚠️ Campaña sin panel asignado: ${campania.nombre}`);
                                }
                            });
                        });
                    });

                    return { campanas: mapeo, usuarios: usuariosPanel };
                }

                function obtenerFilasSinCoincidenciaMeta(panel, campaniasFiltradas) {
                    const resultado = [];
                    const campañasPanel = panel.campañas || {};

                    Object.entries(campañasPanel).forEach(([nombreCampania, datosCampania]) => {
                        if (nombreCampania === 'SIN_CAMPAÑA') return;

                        const mensajes = parseInt(datosCampania?.mensajes || 0, 10);
                        const cargas = parseInt(datosCampania?.cargas || 0, 10);

                        if (mensajes <= 0) return;

                        const nombreNormalizado = normalizarNombre(nombreCampania);
                        let tieneCoincidenciaMeta = false;

                        if (nombreCampania.length === 1) {
                            const letra = nombreCampania.toUpperCase();
                            tieneCoincidenciaMeta = campaniasFiltradas.some(c => {
                                const match = c.nombre?.match(/-([a-z])-/i);
                                return match && match[1] && match[1].toUpperCase() === letra;
                            });
                        } else {
                            tieneCoincidenciaMeta = campaniasFiltradas.some(c => {
                                const nombreMetaNormalizado = normalizarNombre(c.nombre || '');
                                const mismoNombre = nombreMetaNormalizado === nombreNormalizado;
                                const incluyeNombre = nombreMetaNormalizado.includes(nombreNormalizado) || nombreNormalizado.includes(nombreMetaNormalizado);
                                if (mismoNombre || incluyeNombre) return true;

                                const palabrasPanel = nombreNormalizado.split(' ').filter(p => p.length >= 2 && !/^\d+$/.test(p));
                                const palabrasMeta = nombreMetaNormalizado.split(' ').filter(p => p.length >= 2 && !/^\d+$/.test(p));
                                const palabrasComunes = palabrasPanel.filter(p => palabrasMeta.includes(p));
                                return palabrasComunes.length >= 2;
                            });
                        }

                        if (!tieneCoincidenciaMeta) {
                            resultado.push({
                                campania: nombreCampania,
                                mensajes,
                                cargas
                            });
                        }
                    });

                    return resultado;
                }
